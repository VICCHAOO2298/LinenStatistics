<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>露營車拆床登記系統</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        brand: {
                            base: '#f2f0ed', // 米灰底色
                            dark: '#666464', // 深暖灰
                            accent: '#72c3d7' // 柔和青色
                        }
                    }
                }
            }
        }
    </script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <style>
        * { -webkit-tap-highlight-color: transparent; user-select: none; }
        input, textarea { user-select: auto; }
        body { 
            background-color: #f2f0ed; 
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; 
            -webkit-font-smoothing: antialiased;
        }
        .no-scrollbar::-webkit-scrollbar { display: none; }
        .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
        @keyframes fade-in { from { opacity: 0; } to { opacity: 1; } }
        .animate-enter { animation: fade-in 0.3s ease-out forwards; }
        @keyframes scale-in { from { opacity: 0; transform: scale(0.95); } to { opacity: 1; transform: scale(1); } }
        .animate-scale { animation: scale-in 0.2s cubic-bezier(0.16, 1, 0.3, 1) forwards; }
        input[type="date"]::-webkit-calendar-picker-indicator,
        input[type="month"]::-webkit-calendar-picker-indicator {
            background: transparent; bottom: 0; color: transparent; cursor: pointer; height: auto; left: 0;
            position: absolute; right: 0; top: 0; width: auto; z-index: 10;
        }
    </style>
</head>
<body class="text-brand-dark h-[100dvh] w-screen overflow-hidden flex justify-center bg-brand-base">

    <div id="app" class="h-full w-full max-w-md bg-white shadow-2xl relative flex flex-col overflow-hidden"></div>
    <div id="modal-root"></div>

    <script>
        function getTodayString() {
            const d = new Date();
            const year = d.getFullYear();
            const month = String(d.getMonth() + 1).padStart(2, '0');
            const day = String(d.getDate()).padStart(2, '0');
            return `${year}-${month}-${day}`;
        }

        const STORAGE_KEY = 'laundry_data_standalone';
        let allData = JSON.parse(localStorage.getItem(STORAGE_KEY)) || {};
        
        let state = {
            view: localStorage.getItem('laundry_role') ? 'home' : 'login', 
            loginRole: null, 
            role: localStorage.getItem('laundry_role') || null,
            currentRoom: null,
            currentDate: getTodayString(),
            summaryFilter: 'today',
            summaryMonth: getTodayString().substring(0, 7),
            isRetro: false
        };

        const PASSWORDS = { counter: '0000' };

        const DEFAULT_CATEGORIES = [
            { name: "床單被套類", color: "yellow", items: ["大被套", "大床包", "小被套", "墊被套", "枕頭套"] },
            { name: "毛巾足布類", color: "blue", items: ["大毛", "中毛", "足布", "U足"] },
            { name: "拖鞋類", color: "green", items: ["綠拖", "紅拖", "小拖"] },
            { name: "寵物類", color: "red", items: ["狗毛", "狗墊"] }
        ];

        let appCategories = JSON.parse(localStorage.getItem('laundry_cats_standalone')) || DEFAULT_CATEGORIES;
        let appShortcuts = JSON.parse(localStorage.getItem('laundry_shortcuts_standalone')) || ["保潔墊", "沙發套", "抱枕套"];
        
        // 您的專屬 GAS API 網址
        const appGasUrl = 'https://script.google.com/macros/s/AKfycbzzo2Nu8W17lshyfV9TazThsejYbf-GloimfbtZpsQ0pW2_p3ME33QeyThDQ2gvETANLQ/exec';

        function saveCategories() { localStorage.setItem('laundry_cats_standalone', JSON.stringify(appCategories)); }
        function saveShortcuts() { localStorage.setItem('laundry_shortcuts_standalone', JSON.stringify(appShortcuts)); }
        function saveAllData() { localStorage.setItem(STORAGE_KEY, JSON.stringify(allData)); }

        function getRoomsData() {
            if (!allData[state.currentDate]) allData[state.currentDate] = { rooms: {}, returned: {} };
            let currentData = allData[state.currentDate].rooms || {};
            for (let r in currentData) {
                if (currentData[r].status === '預退') currentData[r].status = '未退';
            }
            return currentData;
        }

        const ROOMS = Array.from({length: 20}, (_, i) => String(8601 + i));

        const THEMES = {
            yellow: { activeBg: 'bg-amber-400', activeText: 'text-white', activeShadow: 'shadow-amber-400/30' },
            blue: { activeBg: 'bg-brand-accent', activeText: 'text-white', activeShadow: 'shadow-brand-accent/30' },
            green: { activeBg: 'bg-emerald-400', activeText: 'text-white', activeShadow: 'shadow-emerald-400/30' },
            red: { activeBg: 'bg-rose-400', activeText: 'text-white', activeShadow: 'shadow-rose-400/30' }
        };

        const appDiv = document.getElementById('app');

        function render() {
            if (state.view === 'login') {
                appDiv.innerHTML = renderLogin();
                return;
            }

            let skeleton = document.getElementById('app-skeleton');
            if (!skeleton) {
                appDiv.innerHTML = `
                    <div id="app-skeleton" class="flex flex-col h-full w-full relative">
                        <div id="header-container" class="z-20 shrink-0"></div>
                        <div id="main-scroll" class="flex-1 overflow-y-auto no-scrollbar bg-brand-base/50 relative">
                            <div id="view-container" class="animate-enter min-h-full flex flex-col"></div>
                        </div>
                    </div>
                `;
            }

            document.getElementById('header-container').innerHTML = renderHeader();
            const viewContainer = document.getElementById('view-container');
            
            if (state.view === 'home') viewContainer.innerHTML = renderHome();
            else if (state.view === 'room') viewContainer.innerHTML = renderRoom(state.currentRoom);
            else if (state.view === 'summary') viewContainer.innerHTML = renderSummary();
            else if (state.view === 'settings') viewContainer.innerHTML = renderSettings();
        }

        function refreshHomeView() {
            if (state.view === 'home') {
                const vc = document.getElementById('view-container');
                if (vc) vc.innerHTML = renderHome();
            }
        }

        function renderLogin() {
            if (!state.loginRole) {
                return `
                    <div class="h-full flex flex-col bg-brand-base p-6 animate-scale">
                        <div class="flex-1 flex flex-col justify-center items-center">
                            <div class="w-20 h-20 bg-brand-accent rounded-3xl shadow-xl flex items-center justify-center mb-8 rotate-3 shadow-brand-accent/20">
                                <i class="fa-solid fa-layer-group text-3xl text-white"></i>
                            </div>
                            <h1 class="text-3xl font-bold tracking-tight text-brand-dark mb-12">露營車拆床登記系統</h1>
                            
                            <div class="w-full space-y-4 max-w-xs">
                                <button onclick="selectLoginRole('counter')" class="group relative w-full p-4 rounded-2xl bg-white border border-brand-dark/10 shadow-sm hover:border-brand-accent/50 active:scale-95 transition-all flex items-center gap-4">
                                    <div class="w-12 h-12 rounded-xl bg-brand-base flex items-center justify-center text-brand-dark group-hover:scale-110 transition-transform">
                                        <i class="fa-solid fa-desktop text-xl"></i>
                                    </div>
                                    <div class="text-left"><div class="font-bold text-brand-dark text-lg">櫃台</div></div>
                                    <i class="fa-solid fa-chevron-right ml-auto text-brand-dark/30"></i>
                                </button>
                                
                                <button onclick="selectLoginRole('housekeeping')" class="group relative w-full p-4 rounded-2xl bg-white border border-brand-dark/10 shadow-sm hover:border-brand-accent/50 active:scale-95 transition-all flex items-center gap-4">
                                    <div class="w-12 h-12 rounded-xl bg-brand-base flex items-center justify-center text-brand-dark group-hover:scale-110 transition-transform">
                                        <i class="fa-solid fa-bed text-xl"></i>
                                    </div>
                                    <div class="text-left"><div class="font-bold text-brand-dark text-lg">拆床</div></div>
                                    <i class="fa-solid fa-chevron-right ml-auto text-brand-dark/30"></i>
                                </button>
                            </div>
                        </div>
                    </div>
                `;
            } else {
                return `
                    <div class="h-full flex flex-col bg-brand-base p-6 animate-scale">
                        <button onclick="selectLoginRole(null)" class="absolute top-6 left-6 w-10 h-10 rounded-full bg-white shadow-sm flex items-center justify-center text-brand-dark/60 active:scale-90 transition-transform">
                            <i class="fa-solid fa-arrow-left"></i>
                        </button>
                        <div class="flex-1 flex flex-col justify-center max-w-xs mx-auto w-full">
                            <div class="text-center mb-10">
                                <p class="text-brand-dark/60 text-sm mb-1">正在登入為</p>
                                <h2 class="text-3xl font-bold tracking-tight text-brand-accent">櫃台</h2>
                            </div>
                            <div class="space-y-6">
                                <div class="space-y-2">
                                    <label class="text-xs font-bold text-brand-dark/50 uppercase tracking-wider ml-1">Password</label>
                                    <input type="password" id="pwdInput" placeholder="請輸入密碼" 
                                           class="w-full px-5 py-4 rounded-2xl bg-white border border-brand-dark/10 focus:outline-none focus:border-brand-accent focus:ring-4 focus:ring-brand-accent/20 text-center text-xl tracking-[0.3em] font-mono shadow-sm transition-all text-brand-dark">
                                </div>
                                <button onclick="attemptLogin()" class="w-full py-4 rounded-2xl font-bold text-white shadow-lg shadow-brand-accent/20 active:scale-95 transition-all bg-brand-accent">確認登入</button>
                            </div>
                        </div>
                    </div>
                `;
            }
        }

        function renderHeader() {
            let content = '';
            
            const dateDisplay = `
                <div class="bg-${state.isRetro ? 'rose-50' : 'brand-accent/10'} rounded-md px-2 py-0.5 flex items-center gap-1.5 text-${state.isRetro ? 'rose-600' : 'brand-accent'} text-[10px] font-bold border ${state.isRetro ? 'border-rose-200' : 'border-brand-accent/20'}">
                    <i class="fa-solid fa-calendar-day text-${state.isRetro ? 'rose-400' : 'brand-accent'}"></i>
                    ${state.currentDate.replace(/-/g, '/')}
                    ${state.isRetro ? '<button onclick="exitRetro(event)" class="ml-1 px-1.5 py-0.5 bg-rose-500 text-white rounded flex items-center gap-1 text-[9px] active:scale-90 transition-transform shadow-sm">結束補登 <i class="fa-solid fa-xmark"></i></button>' : ''}
                </div>
            `;

            if (state.view === 'home') {
                const isCounter = state.role === 'counter';
                content = `
                    <div class="flex justify-between items-center w-full">
                        <div class="flex flex-col items-start gap-1.5">
                            <span class="text-[17px] font-bold text-brand-dark tracking-tight leading-none mt-1">露營車拆床系統</span>
                            <div class="flex items-center gap-1.5">
                                <span class="text-[9px] font-bold text-white uppercase tracking-widest bg-brand-accent px-1.5 py-0.5 rounded">${state.role === 'counter' ? '櫃台' : '拆床'}</span>
                                ${dateDisplay}
                            </div>
                        </div>
                        <div class="flex gap-2 items-center shrink-0">
                            ${isCounter ? `<button onclick="openReturnedModal()" class="w-9 h-9 flex items-center justify-center bg-brand-accent text-white rounded-full active:scale-95 transition-all shadow-md shadow-brand-accent/30"><i class="fa-solid fa-truck-ramp-box text-[13px]"></i></button>` : ''}
                            <button onclick="goToSummary()" class="w-9 h-9 flex items-center justify-center bg-brand-dark text-white rounded-full shadow-md active:scale-95 transition-all"><i class="fa-solid fa-chart-pie text-[13px]"></i></button>
                            ${isCounter ? `<button onclick="goToSettings()" class="w-9 h-9 flex items-center justify-center bg-brand-base text-brand-dark rounded-full border border-brand-dark/10 active:scale-95 transition-all"><i class="fa-solid fa-sliders text-[13px]"></i></button>` : ''}
                            <button onclick="logout()" class="w-9 h-9 flex items-center justify-center bg-brand-base text-brand-dark/50 rounded-full active:scale-95 transition-all"><i class="fa-solid fa-arrow-right-from-bracket text-[13px]"></i></button>
                        </div>
                    </div>
                `;
            } else if (state.view === 'room') {
                content = `
                    <button onclick="goHome()" class="w-10 h-10 flex items-center justify-start text-brand-dark/60 active:text-brand-dark transition-colors"><i class="fa-solid fa-chevron-left text-xl"></i></button>
                    <div class="flex-1 flex justify-center text-center"><span class="text-xl font-bold font-mono tracking-tight text-brand-dark">${state.currentRoom}</span></div>
                    <div class="w-10"></div>
                `;
            } else if (state.view === 'summary') {
                content = `
                    <button onclick="goHome()" class="w-10 h-10 flex items-center justify-start text-brand-dark/60 active:text-brand-dark transition-colors"><i class="fa-solid fa-chevron-left text-xl"></i></button>
                    <div class="flex-1 flex justify-center text-center"><span class="text-lg font-bold text-brand-dark tracking-tight">總計</span></div>
                    <div class="w-10"></div>
                `;
            } else if (state.view === 'settings') {
                content = `
                    <button onclick="goHome()" class="w-10 h-10 flex items-center justify-start text-brand-dark/60 active:text-brand-dark transition-colors"><i class="fa-solid fa-chevron-left text-xl"></i></button>
                    <div class="flex-1 flex justify-center text-center"><span class="text-lg font-bold text-brand-dark tracking-tight">系統設定</span></div>
                    <div class="w-10"></div>
                `;
            }

            return `<div class="bg-white px-4 pt-12 pb-3 flex justify-between items-center border-b border-brand-dark/5 shadow-sm min-h-[80px]">${content}</div>`;
        }

        function renderHome() {
            let roomsData = getRoomsData();
            let html = `<div class="p-3 pt-4 grid grid-cols-4 gap-2">`;
            
            ROOMS.forEach(room => {
                const data = roomsData[room] || { items: {}, note: '', status: '空車', specialType: '一般' };
                const hasData = Object.values(data.items || {}).some(val => val > 0);
                const hasNote = !!data.note;
                const status = data.status || '空車';
                const specialType = data.specialType || '一般';
                
                let cardStyle = '';
                let textColor = '';
                let badgeClass = '';

                if (status === '空車') {
                    cardStyle = 'bg-white shadow-sm ring-1 ring-brand-dark/10';
                    textColor = 'text-brand-dark';
                    badgeClass = 'bg-brand-dark/5 text-brand-dark/60 ring-1 ring-brand-dark/10';
                } else if (status === '未退') {
                    cardStyle = 'bg-gradient-to-br from-rose-400 to-rose-500 shadow-rose-500/20 ring-1 ring-rose-400';
                    textColor = 'text-white';
                    badgeClass = 'bg-black/10 text-white';
                } else if (status === '退房') {
                    cardStyle = 'bg-gradient-to-br from-lime-300 to-lime-400 shadow-lime-500/20 ring-1 ring-lime-400';
                    textColor = 'text-lime-950';
                    badgeClass = 'bg-lime-900/10 text-lime-950';
                }

                const clickAction = state.role === 'counter' ? `toggleRoomStatus('${room}', event)` : `goToRoom('${room}')`;

                let specialBg = '';
                let specialContent = '';
                if (specialType === '一般') {
                    specialBg = 'bg-white/90 backdrop-blur-sm text-brand-dark/30';
                    specialContent = '<div class="w-1.5 h-1.5 rounded-full bg-brand-dark/20"></div>';
                } else if (specialType === 'O房') {
                    specialBg = 'bg-slate-700 text-white shadow-md';
                    specialContent = '<i class="fa-solid fa-bug text-[10px]"></i>';
                } else if (specialType === '寵物房') {
                    specialBg = 'bg-amber-500 text-white shadow-md';
                    specialContent = '<i class="fa-solid fa-paw text-[10px]"></i>';
                }

                html += `
                    <div id="card-${room}" onclick="${clickAction}" class="relative rounded-xl p-1 active:scale-95 transition-all duration-200 ${cardStyle} shadow-md cursor-pointer">
                        ${(state.role === 'counter' || specialType !== '一般') ? `
                        <div onclick="${state.role === 'counter' ? `toggleSpecialType('${room}', event)` : ''}" class="absolute top-0 right-0 h-6 min-w-[24px] px-1 rounded-tr-[12px] rounded-bl-lg flex items-center justify-center z-20 border-l border-b border-black/5 ${state.role === 'counter' ? 'hover:scale-110 cursor-pointer' : ''} transition-transform ${specialBg}">
                            ${specialContent}
                        </div>
                        ` : ''}

                        <div class="h-16 rounded-lg flex flex-col items-center justify-center relative overflow-hidden pt-1">
                            <span class="text-base font-black font-mono tracking-tighter z-10 leading-none ${textColor}">${room}</span>
                            <span class="mt-1 text-[8px] font-bold px-1.5 py-0.5 rounded-sm z-10 uppercase tracking-widest leading-none ${badgeClass}">${status}</span>
                            
                            <div class="absolute bottom-1 flex gap-1 z-10">
                                ${hasData ? `<div class="w-1 h-1 rounded-full ${status === '空車' ? 'bg-brand-accent' : 'bg-white'} shadow-sm opacity-90"></div>` : ''}
                                ${hasNote && state.role !== 'counter' ? `<div class="w-1 h-1 rounded-full bg-yellow-400 shadow-sm opacity-90"></div>` : ''}
                            </div>
                        </div>
                    </div>
                `;
            });
            html += `</div>`;
            
            // 櫃台當日快速總計區
            if (state.role === 'counter') {
                let totalItems = {};
                let recordedRooms = 0;
                let targetStatusRoomsCount = 0;

                appCategories.forEach(cat => cat.items.forEach(item => totalItems[item] = 0));

                ROOMS.forEach(room => {
                    const data = roomsData[room] || { items: {}, note: '', status: '空車', specialType: '一般' };
                    if (['未退', '退房'].includes(data.status)) targetStatusRoomsCount++;

                    let hasItem = false;
                    if (data.items) {
                        for (const item in data.items) {
                            if (data.items[item] > 0) {
                                totalItems[item] += data.items[item];
                                hasItem = true;
                            }
                        }
                    }
                    if (hasItem || data.note || data.specialType !== '一般') recordedRooms++;
                });

                let uncleanedRooms = Math.max(0, targetStatusRoomsCount - recordedRooms);
                
                html += `
                    <div class="px-3 pb-8 mt-2">
                        <div class="bg-white rounded-2xl p-4 shadow-sm border border-brand-dark/10 mb-4">
                            <h3 class="font-bold text-brand-dark text-sm mb-3 flex items-center gap-2">
                                <i class="fa-solid fa-bolt text-brand-accent"></i> 當日快速總計
                            </h3>
                            
                            <div class="flex gap-3 mb-4">
                                <div class="flex-1 bg-brand-base/50 rounded-xl p-3 border border-brand-dark/5 flex flex-col items-center justify-center">
                                    <span class="text-[11px] font-bold text-brand-dark/50 mb-1">已記錄</span>
                                    <span class="text-2xl font-black font-mono text-brand-accent leading-none">${recordedRooms}</span>
                                </div>
                                <div class="flex-1 bg-rose-50 rounded-xl p-3 border border-rose-100 flex flex-col items-center justify-center">
                                    <span class="text-[11px] font-bold text-rose-400 mb-1">未拆間數</span>
                                    <span class="text-2xl font-black font-mono text-rose-500 leading-none">${uncleanedRooms}</span>
                                </div>
                            </div>
                `;

                let hasAnyItem = Object.values(totalItems).some(count => count > 0);
                if (hasAnyItem) {
                    html += `<div class="space-y-4 mb-2">`;
                    appCategories.forEach(cat => {
                        let hasCountInCategory = cat.items.some(item => totalItems[item] > 0);
                        if (hasCountInCategory) {
                            const theme = THEMES[cat.color] || THEMES.blue;
                            html += `
                                <div>
                                    <div class="flex items-center gap-1.5 mb-2">
                                        <div class="w-2 h-2 rounded-full ${theme.activeBg} opacity-80"></div>
                                        <span class="text-[11px] font-bold text-brand-dark/60 tracking-wider">${cat.name}</span>
                                    </div>
                                    <div class="grid grid-cols-5 gap-1.5">
                            `;
                            cat.items.forEach(item => {
                                if (totalItems[item] > 0) {
                                    html += `
                                        <div class="bg-brand-base py-1.5 px-1 rounded-lg flex flex-col items-center justify-center border border-brand-dark/10 shadow-sm overflow-hidden">
                                            <span class="text-[10px] font-semibold text-brand-dark/80 w-full text-center truncate mb-0.5">${item}</span>
                                            <span class="text-[14px] font-black font-mono text-brand-dark leading-none">${totalItems[item]}</span>
                                        </div>
                                    `;
                                }
                            });
                            html += `</div></div>`;
                        }
                    });
                    html += `</div>`;
                } else {
                    html += `<div class="text-center text-brand-dark/30 text-xs py-3 font-medium border border-dashed border-brand-dark/10 rounded-xl mb-3">尚無備品紀錄</div>`;
                }

                html += `
                        </div>
                        <button onclick="syncToGoogleSheets()" class="w-full py-3.5 rounded-xl bg-brand-accent text-white font-bold shadow-lg shadow-brand-accent/30 active:scale-95 transition-all flex items-center justify-center gap-2">
                            <i class="fa-solid fa-cloud-arrow-up"></i> 📤 同步至 Google 試算表
                        </button>
                    </div>
                `;
            } else {
                html += `<div class="pb-10"></div>`;
            }
            
            return html;
        }

        function renderRoom(roomNumber) {
            let roomsData = getRoomsData();
            let roomData = roomsData[roomNumber] || { items: {}, note: '', status: '空車' };
            
            let html = `<div class="p-3 space-y-4 pb-10">`;

            // 扁平化備品清單
            html += `<div class="bg-white rounded-2xl p-4 shadow-sm border border-brand-dark/10">
                        <div class="space-y-3">`;

            appCategories.forEach(category => {
                category.items.forEach(item => {
                    const count = roomData.items[item] || 0;
                    const theme = THEMES[category.color] || THEMES.blue;
                    html += `
                        <div class="flex items-center justify-between gap-3">
                            <div class="text-[13px] font-semibold text-brand-dark/90 w-12 shrink-0">${item}</div>
                            <div class="flex-1 flex bg-brand-base/50 p-1 rounded-xl relative">
                                ${[0, 1, 2, 3, 4, 5].map(num => {
                                    const isActive = count === num;
                                    const btnClass = isActive 
                                        ? `${theme.activeBg} ${theme.activeText} shadow-md ${theme.activeShadow} font-bold scale-100` 
                                        : `text-brand-dark/50 font-medium hover:bg-brand-dark/5 scale-95`;
                                        
                                    return `
                                        <button onclick="updateCount('${roomNumber}', '${item}', ${num}, event)" 
                                                class="flex-1 py-1.5 rounded-lg text-base transition-all duration-200 ease-out z-10 ${btnClass}">
                                            ${num}
                                        </button>
                                    `;
                                }).join('')}
                            </div>
                        </div>
                    `;
                });
            });

            html += `</div></div>`;

            // 備註區
            html += `
                <div class="bg-white rounded-2xl p-4 shadow-sm border border-brand-dark/10">
                    <div class="flex items-center gap-2 mb-2">
                        <i class="fa-regular fa-comment-dots text-brand-dark/40"></i>
                        <h3 class="font-bold text-brand-dark text-sm tracking-wide">特殊備註</h3>
                    </div>
            `;
            
            if (appShortcuts.length > 0) {
                html += `<div class="flex gap-2 overflow-x-auto no-scrollbar py-1 mb-2">`;
                appShortcuts.forEach(sc => {
                    html += `<button onclick="insertShortcut('${roomNumber}', '${sc}')" class="shrink-0 px-3 py-1.5 bg-brand-base hover:bg-brand-dark/10 text-brand-dark/90 rounded-lg text-[13px] font-bold transition-colors border border-brand-dark/10 active:scale-95 flex items-center gap-1.5"><i class="fa-solid fa-plus text-[10px] text-brand-dark/40"></i>${sc}</button>`;
                });
                html += `</div>`;
            }

            html += `
                    <textarea 
                        id="note-${roomNumber}" 
                        class="w-full p-3 bg-brand-base/50 border border-brand-dark/5 rounded-xl focus:outline-none focus:ring-2 focus:ring-brand-accent focus:bg-white resize-none h-20 text-brand-dark text-sm leading-relaxed" 
                        placeholder="請輸入備註內容...">${roomData.note || ''}</textarea>
                    
                    <button onclick="submitNoteBtn('${roomNumber}')" class="w-full mt-3 py-3 rounded-xl bg-brand-accent text-white font-bold shadow-lg shadow-brand-accent/30 active:scale-95 transition-all flex items-center justify-center gap-2">
                        <i class="fa-solid fa-check"></i> 儲存並返回
                    </button>
                </div>
            `;
            html += `</div>`;
            return html;
        }

        function renderSummary() {
            let targetDates = [];
            const todayStr = getTodayString();
            
            if (state.summaryFilter === 'today') {
                targetDates = [todayStr];
            } else if (state.summaryFilter === 'date') {
                targetDates = [state.currentDate];
            } else if (state.summaryFilter === 'mtd') {
                const year = todayStr.substring(0, 4);
                const month = todayStr.substring(5, 7);
                const day = parseInt(todayStr.substring(8, 10), 10);
                for (let i = 1; i <= day; i++) targetDates.push(`${year}-${month}-${String(i).padStart(2, '0')}`);
            } else if (state.summaryFilter === 'month') {
                targetDates = Object.keys(allData).filter(d => d.startsWith(state.summaryMonth));
            }

            let totalItems = {};
            let totalReturned = {};
            let noteCounts = {};
            let recordedRooms = 0;
            let targetStatusCount = 0;

            appCategories.forEach(cat => cat.items.forEach(item => { totalItems[item] = 0; totalReturned[item] = 0; }));
            
            targetDates.forEach(date => {
                let dayData = allData[date] || { rooms: {}, returned: {} };
                let roomsData = dayData.rooms || {};
                let returnedData = dayData.returned || {};
                
                ROOMS.forEach(room => {
                    const data = roomsData[room];
                    if (!data) return;
                    if (['未退', '退房'].includes(data.status)) targetStatusCount++;
                    
                    let hasItem = false;
                    if (data.items) {
                        for (const item in data.items) {
                            if (data.items[item] > 0) {
                                if(totalItems[item] === undefined) totalItems[item] = 0;
                                totalItems[item] += data.items[item];
                                hasItem = true;
                            }
                        }
                    }
                    if (data.note) {
                        data.note.split('\n').forEach(n => {
                            const t = n.trim();
                            if (t) noteCounts[t] = (noteCounts[t] || 0) + 1;
                        });
                    }
                    if (hasItem || data.note || data.specialType !== '一般') recordedRooms++;
                });

                for (const item in returnedData) {
                    if(totalReturned[item] !== undefined) totalReturned[item] += returnedData[item];
                }
            });

            let uncleanedRooms = Math.max(0, targetStatusCount - recordedRooms);

            let html = `
                <div class="p-4 space-y-4 pb-10">
                    <div class="bg-white p-2 rounded-2xl shadow-sm border border-brand-dark/10">
                        <div class="flex gap-1 overflow-x-auto no-scrollbar">
                            <button onclick="setSummaryFilter('today')" class="whitespace-nowrap flex-1 px-3 py-2.5 rounded-xl text-[13px] font-bold transition-colors ${state.summaryFilter==='today' ? 'bg-brand-accent text-white shadow-md' : 'bg-brand-base text-brand-dark/70'}">當天</button>
                            <button onclick="setSummaryFilter('date')" class="whitespace-nowrap flex-1 px-3 py-2.5 rounded-xl text-[13px] font-bold transition-colors ${state.summaryFilter==='date' ? 'bg-brand-accent text-white shadow-md' : 'bg-brand-base text-brand-dark/70'}">指定日期</button>
                            <button onclick="setSummaryFilter('mtd')" class="whitespace-nowrap flex-1 px-3 py-2.5 rounded-xl text-[13px] font-bold transition-colors ${state.summaryFilter==='mtd' ? 'bg-brand-accent text-white shadow-md' : 'bg-brand-base text-brand-dark/70'}">本月至今</button>
                            <button onclick="setSummaryFilter('month')" class="whitespace-nowrap flex-1 px-3 py-2.5 rounded-xl text-[13px] font-bold transition-colors ${state.summaryFilter==='month' ? 'bg-brand-accent text-white shadow-md' : 'bg-brand-base text-brand-dark/70'}">指定月份</button>
                        </div>
                        
                        ${state.summaryFilter === 'date' ? `
                            <div class="mt-2 flex gap-2">
                                <div class="relative flex-1 bg-brand-base rounded-xl px-4 py-3 flex items-center justify-between border border-brand-dark/5">
                                    <span class="text-brand-dark font-bold text-sm flex items-center gap-2"><i class="fa-regular fa-calendar text-brand-dark/50"></i> ${state.currentDate.replace(/-/g, '/')}</span>
                                    <span class="text-xs text-brand-dark bg-brand-accent/30 px-2 py-1 rounded-md font-bold">變更日期</span>
                                    <input type="date" value="${state.currentDate}" onchange="changeSummaryDate(this.value)" class="absolute inset-0 w-full h-full cursor-pointer z-10 opacity-0" style="-webkit-appearance: none; appearance: none;">
                                </div>
                                <button onclick="startRetro()" class="px-4 py-3 bg-brand-dark text-white rounded-xl text-sm font-bold shadow-md active:scale-95 transition-all flex items-center gap-1.5 shrink-0">
                                    <i class="fa-solid fa-pen-to-square"></i> 補登
                                </button>
                            </div>
                        ` : ''}
                        
                        ${state.summaryFilter === 'month' ? `
                            <div class="mt-2 relative bg-brand-base rounded-xl px-4 py-3 flex items-center justify-between border border-brand-dark/5">
                                <span class="text-brand-dark font-bold text-sm flex items-center gap-2"><i class="fa-regular fa-calendar-days text-brand-dark/50"></i> ${state.summaryMonth.replace('-', ' / ')}</span>
                                <span class="text-xs text-brand-dark bg-brand-accent/30 px-2 py-1 rounded-md font-bold">變更月份</span>
                                <input type="month" value="${state.summaryMonth}" onchange="changeSummaryMonth(this.value)" class="absolute inset-0 opacity-0 w-full h-full cursor-pointer z-10" style="-webkit-appearance: none; appearance: none;">
                            </div>
                        ` : ''}
                    </div>

                    <div class="grid grid-cols-2 gap-3 mb-2">
                        <div class="bg-brand-dark rounded-2xl p-4 shadow-lg shadow-brand-dark/20 text-center relative overflow-hidden flex flex-col justify-center">
                            <div class="text-[11px] text-white/60 font-medium mb-1">已記錄房間</div>
                            <div class="text-3xl font-black text-white font-mono tracking-tight">${recordedRooms}</div>
                        </div>
                        <div class="bg-rose-400 rounded-2xl p-4 shadow-lg shadow-rose-400/20 text-center relative overflow-hidden flex flex-col justify-center">
                            <div class="text-[11px] text-white/80 font-medium mb-1">未拆間數</div>
                            <div class="text-3xl font-black text-white font-mono tracking-tight">${uncleanedRooms}</div>
                        </div>
                    </div>
            `;

            let hasAnyItem = appCategories.some(cat => cat.items.some(item => totalItems[item] > 0 || totalReturned[item] > 0));

            if (hasAnyItem) {
                html += `
                    <div class="bg-white rounded-2xl p-4 shadow-sm border border-brand-dark/10 mb-2">
                        <h3 class="font-bold text-brand-dark text-sm tracking-wide mb-3">備品對照清單</h3>
                        <div class="space-y-0 divide-y divide-brand-dark/5">
                            <div class="flex justify-between items-center py-2 text-[10px] text-brand-dark/50 font-bold tracking-wider">
                                <span class="w-16 shrink-0">品項</span>
                                <div class="flex-1 flex justify-end gap-2 sm:gap-4 text-center">
                                    <span class="w-10">拆床</span><span class="w-10 text-brand-accent">洗回</span><span class="w-10">差異</span>
                                </div>
                            </div>
                `;
                
                // 扁平化列表顯示
                appCategories.forEach(category => {
                    category.items.forEach(item => {
                        const count = totalItems[item];
                        const retCount = totalReturned[item];
                        if (count > 0 || retCount > 0) {
                            const diff = retCount - count;
                            let diffHtml = diff < 0 ? `<span class="text-rose-500 font-bold">${diff}</span>` :
                                           diff > 0 ? `<span class="text-emerald-500 font-bold">+${diff}</span>` :
                                           `<span class="text-brand-dark/30 font-bold">0</span>`;

                            html += `
                                <div class="flex justify-between items-center py-2.5">
                                    <span class="text-[13px] font-semibold text-brand-dark/80 w-16 shrink-0 break-all leading-tight">${item}</span>
                                    <div class="flex-1 flex justify-end gap-2 sm:gap-4 text-center font-mono text-base">
                                        <span class="w-10 font-medium text-brand-dark/70">${count}</span>
                                        <span class="w-10 font-black text-brand-accent">${retCount}</span>
                                        <span class="w-10">${diffHtml}</span>
                                    </div>
                                </div>
                            `;
                        }
                    });
                });
                html += `</div></div>`;
            }

            if (Object.keys(noteCounts).length > 0) {
                html += `
                    <div class="bg-white rounded-2xl p-4 shadow-sm border border-brand-dark/10">
                        <h3 class="font-bold text-brand-dark text-sm mb-2 tracking-wide flex justify-between items-center">
                            <span>備註彙整統計</span>
                            <div class="w-8 h-1 rounded-full bg-brand-accent opacity-50"></div>
                        </h3>
                        <div class="space-y-0 divide-y divide-brand-dark/5">
                `;
                for (const [noteText, count] of Object.entries(noteCounts)) {
                    html += `
                        <div class="flex justify-between items-center py-2.5 gap-4">
                            <span class="text-sm font-semibold text-brand-dark/90 break-all">${noteText}</span>
                            <span class="text-lg font-black font-mono leading-none text-brand-dark/50 shrink-0">x${count}</span>
                        </div>
                    `;
                }
                html += `</div></div>`;
            }

            if (recordedRooms === 0 && uncleanedRooms === 0) {
                html += `<div class="text-center text-brand-dark/40 py-12 flex flex-col items-center">
                            <div class="w-16 h-16 bg-brand-base rounded-full flex items-center justify-center mb-4"><i class="fa-solid fa-box-open text-2xl opacity-50"></i></div>
                            <span class="text-sm font-medium">指定區間內尚無任何紀錄</span>
                         </div>`;
            }

            html += `</div>`;
            return html;
        }

        function renderSettings() {
            let html = `<div class="p-5 space-y-6 pb-10">`;

            appCategories.forEach((cat, cIndex) => {
                html += `
                    <div class="bg-white border border-brand-dark/10 rounded-3xl shadow-sm overflow-hidden">
                        <div class="px-5 py-4 bg-brand-base/50 border-b border-brand-dark/5 flex items-center gap-2">
                            <div class="w-2.5 h-2.5 rounded-full bg-brand-accent"></div>
                            <span class="font-bold text-brand-dark text-sm tracking-wide">${cat.name}</span>
                        </div>
                        <div class="p-2">
                `;

                if(cat.items.length === 0) {
                    html += `<div ondragover="handleDragOver(event)" ondragleave="handleDragLeave(event)" ondrop="handleDropEmpty(event, ${cIndex})" class="draggable-item text-brand-dark/40 text-xs text-center py-6 border-2 border-transparent border-dashed rounded-xl transition-all">分類為空 (可將項目拖曳至此)</div>`;
                } else {
                    html += `<div class="space-y-1">`;
                    cat.items.forEach((item, iIndex) => {
                        html += `
                            <div draggable="true" ondragstart="handleDragStart(event, ${cIndex}, ${iIndex})" ondragover="handleDragOver(event)" ondragleave="handleDragLeave(event)" ondrop="handleDrop(event, ${cIndex}, ${iIndex})" ondragend="handleDragEnd(event)" class="draggable-item flex justify-between items-center px-4 py-3 rounded-2xl hover:bg-brand-base/80 group transition-colors cursor-move">
                                <div class="flex items-center gap-3 pointer-events-none">
                                    <i class="fa-solid fa-grip-vertical text-brand-dark/20"></i>
                                    <span class="font-semibold text-brand-dark/80 text-sm">${item}</span>
                                </div>
                                <button onclick="removeItem(${cIndex}, ${iIndex})" class="w-8 h-8 rounded-full text-brand-dark/30 hover:text-rose-500 hover:bg-rose-50 flex items-center justify-center transition-all active:scale-90"><i class="fa-solid fa-minus text-sm"></i></button>
                            </div>
                        `;
                    });
                    html += `</div>`;
                }

                html += `
                            <div class="flex gap-2 p-2 mt-2 pt-3 border-t border-brand-dark/5">
                                <input type="text" id="new-item-${cIndex}" placeholder="輸入新項目..." class="flex-1 bg-brand-base border-0 rounded-xl px-4 py-3 text-sm focus:outline-none focus:ring-2 focus:ring-brand-accent focus:bg-white transition-all placeholder:text-brand-dark/40 font-medium text-brand-dark">
                                <button onclick="addNewItem(${cIndex})" class="bg-brand-accent text-white px-5 py-3 rounded-xl font-bold text-sm shadow-md active:scale-95 transition-all">新增</button>
                            </div>
                        </div>
                    </div>
                `;
            });

            // 快捷備註設定
            html += `
                <div class="bg-white border border-brand-dark/10 rounded-3xl shadow-sm overflow-hidden mt-4">
                    <div class="px-5 py-4 bg-brand-base/50 border-b border-brand-dark/5 flex items-center gap-2">
                        <div class="w-2.5 h-2.5 rounded-full bg-brand-accent"></div>
                        <span class="font-bold text-brand-dark text-sm tracking-wide">特殊備註快捷鍵</span>
                    </div>
                    <div class="p-2">
            `;
            if(appShortcuts.length === 0) {
                html += `<div class="text-brand-dark/40 text-xs text-center py-6">無快捷鍵 (請在下方新增)</div>`;
            } else {
                html += `<div class="space-y-1">`;
                appShortcuts.forEach((sc, index) => {
                    html += `
                        <div draggable="true" ondragstart="handleShortcutDragStart(event, ${index})" ondragover="handleDragOver(event)" ondragleave="handleDragLeave(event)" ondrop="handleShortcutDrop(event, ${index})" ondragend="handleDragEnd(event)" class="draggable-item flex justify-between items-center px-4 py-3 rounded-2xl hover:bg-brand-base/80 group transition-colors cursor-move">
                            <div class="flex items-center gap-3 pointer-events-none">
                                <i class="fa-solid fa-grip-vertical text-brand-dark/20"></i>
                                <span class="font-semibold text-brand-dark/80 text-sm">${sc}</span>
                            </div>
                            <button onclick="removeShortcut(${index})" class="w-8 h-8 rounded-full text-brand-dark/30 hover:text-rose-500 hover:bg-rose-50 flex items-center justify-center transition-all active:scale-90"><i class="fa-solid fa-minus text-sm"></i></button>
                        </div>
                    `;
                });
                html += `</div>`;
            }
            html += `
                        <div class="flex gap-2 p-2 mt-2 pt-3 border-t border-brand-dark/5">
                            <input type="text" id="new-shortcut" placeholder="輸入新快捷鍵..." class="flex-1 bg-brand-base border-0 rounded-xl px-4 py-3 text-sm focus:outline-none focus:ring-2 focus:ring-brand-accent focus:bg-white transition-all placeholder:text-brand-dark/40 font-medium text-brand-dark">
                            <button onclick="addShortcut()" class="bg-brand-accent text-white px-5 py-3 rounded-xl font-bold text-sm shadow-md active:scale-95 transition-all">新增</button>
                        </div>
                    </div>
                </div>
            </div>`;
            return html;
        }

        function showMessage(msg) {
            const toast = document.createElement('div');
            toast.className = 'fixed top-10 left-1/2 transform -translate-x-1/2 bg-brand-dark/95 backdrop-blur text-white px-6 py-3.5 rounded-full shadow-2xl z-50 animate-enter text-sm font-bold tracking-wide whitespace-nowrap border border-brand-dark flex items-center gap-2';
            toast.innerText = msg;
            document.body.appendChild(toast);
            setTimeout(() => {
                toast.style.opacity = '0';
                toast.style.transition = 'opacity 0.3s ease';
                setTimeout(() => toast.remove(), 300);
            }, 2000);
        }

        function selectLoginRole(role) {
            if (role === 'housekeeping') {
                state.role = 'housekeeping';
                localStorage.setItem('laundry_role', 'housekeeping'); 
                state.loginRole = null;
                state.view = 'home';
                render();
                return;
            }
            state.loginRole = role;
            render();
            if(role) setTimeout(() => document.getElementById('pwdInput').focus(), 100);
        }

        function attemptLogin() {
            const pwdInput = document.getElementById('pwdInput').value;
            if (pwdInput === PASSWORDS[state.loginRole]) {
                state.role = state.loginRole;
                localStorage.setItem('laundry_role', state.role); 
                state.loginRole = null;
                state.view = 'home';
                render();
            } else {
                showMessage('密碼不正確，請再試一次');
                document.getElementById('pwdInput').value = '';
                document.getElementById('pwdInput').focus();
            }
        }

        function logout() {
            state.role = null;
            state.loginRole = null;
            state.view = 'login';
            state.currentDate = getTodayString();
            state.isRetro = false;
            localStorage.removeItem('laundry_role'); 
            render();
        }

        function setSummaryFilter(filter) {
            state.summaryFilter = filter;
            if (filter !== 'date') {
                state.currentDate = getTodayString();
                state.isRetro = false;
            }
            render();
        }

        function changeSummaryDate(val) { if(val) { state.currentDate = val; render(); } }
        function changeSummaryMonth(val) { if(val) { state.summaryMonth = val; render(); } }

        function startRetro() { state.isRetro = true; state.view = 'home'; render(); }
        function exitRetro(e) {
            if (e) e.stopPropagation();
            state.currentDate = getTodayString();
            state.isRetro = false;
            render();
        }

        function toggleRoomStatus(room, event) {
            if(event) event.stopPropagation(); 
            let roomsData = getRoomsData();
            if (!roomsData[room]) roomsData[room] = { items: {}, note: '', status: '空車', specialType: '一般' };
            const nextStatusMap = { '空車': '未退', '未退': '退房', '退房': '空車' };
            roomsData[room].status = nextStatusMap[roomsData[room].status || '空車'] || '未退';
            saveAllData(); 
            if (navigator.vibrate) navigator.vibrate(10);
            refreshHomeView();
        }

        function toggleSpecialType(room, event) {
            if(event) event.stopPropagation(); 
            let roomsData = getRoomsData();
            if (!roomsData[room]) roomsData[room] = { items: {}, note: '', status: '空車', specialType: '一般' };
            const nextMap = { '一般': 'O房', 'O房': '寵物房', '寵物房': '一般' };
            roomsData[room].specialType = nextMap[roomsData[room].specialType || '一般'];
            saveAllData(); 
            if (navigator.vibrate) navigator.vibrate(10);
            refreshHomeView();
        }

        function goToRoom(room) { state.currentRoom = room; state.view = 'room'; render(); }
        function goHome() { state.currentRoom = null; state.view = 'home'; render(); }
        function goToSummary() { 
            state.currentDate = getTodayString();
            state.isRetro = false;
            state.view = 'summary'; 
            render(); 
        }
        function goToSettings() { state.view = 'settings'; render(); }

        function addNewItem(cIndex) {
            const input = document.getElementById(`new-item-${cIndex}`);
            const val = input.value.trim();
            if(val) {
                if(appCategories[cIndex].items.includes(val)) return showMessage('此項目已存在！');
                appCategories[cIndex].items.push(val);
                saveCategories(); render();
            }
        }
        function removeItem(cIndex, iIndex) { appCategories[cIndex].items.splice(iIndex, 1); saveCategories(); render(); }

        function addShortcut() {
            const input = document.getElementById('new-shortcut');
            const val = input.value.trim();
            if(val) {
                if(appShortcuts.includes(val)) return showMessage('此快捷鍵已存在！');
                appShortcuts.push(val);
                saveShortcuts(); render();
            }
        }
        function removeShortcut(index) { appShortcuts.splice(index, 1); saveShortcuts(); render(); }
        
        function insertShortcut(room, text) {
            const textarea = document.getElementById(`note-${room}`);
            let val = textarea.value.trim();
            val = val ? val + '\n' + text : text;
            textarea.value = val;
            let roomsData = getRoomsData();
            if (!roomsData[room]) roomsData[room] = { items: {}, note: '', status: '空車', specialType: '一般' };
            roomsData[room].note = val;
            saveAllData(); 
            if (navigator.vibrate) navigator.vibrate(15);
        }

        function getColorThemeForItem(itemName) {
            for(let cat of appCategories) {
                if(cat.items.includes(itemName)) return THEMES[cat.color] || THEMES.blue;
            }
            return THEMES.blue;
        }

        function updateCount(room, item, count, event) {
            let roomsData = getRoomsData();
            if (!roomsData[room]) roomsData[room] = { items: {}, note: '', status: '空車' };
            if (!roomsData[room].items) roomsData[room].items = {};
            
            if (navigator.vibrate) navigator.vibrate(20);
            
            roomsData[room].items[item] = count;
            saveAllData(); 
            
            const btnContainer = event.target.parentElement;
            const buttons = btnContainer.querySelectorAll('button');
            const themeColor = getColorThemeForItem(item);
            
            buttons.forEach((btn, index) => {
                if(index === count) {
                    btn.className = `flex-1 py-1.5 rounded-lg text-base transition-all duration-200 ease-out z-10 ${themeColor.activeBg} ${themeColor.activeText} shadow-md ${themeColor.activeShadow} font-bold scale-100`;
                } else {
                    btn.className = `flex-1 py-1.5 rounded-lg text-base transition-all duration-200 ease-out z-10 text-brand-dark/50 font-medium hover:bg-brand-dark/5 scale-95`;
                }
            });
        }

        function submitNoteBtn(room) {
            const noteText = document.getElementById(`note-${room}`).value;
            let roomsData = getRoomsData();
            if (!roomsData[room]) roomsData[room] = { items: {}, note: '', status: '空車' };
            roomsData[room].note = noteText;
            saveAllData(); 
            if (navigator.vibrate) navigator.vibrate(50);
            showMessage('✅ 備註已儲存');
            goHome();
        }

        let dragSource = null;
        let shortcutDragSource = null;

        function handleDragStart(e, cIndex, iIndex) {
            dragSource = { cIndex, iIndex };
            e.dataTransfer.effectAllowed = 'move';
            e.dataTransfer.setData('text/plain', '');
            setTimeout(() => e.target.classList.add('opacity-40', 'bg-brand-base'), 0);
        }
        function handleShortcutDragStart(e, index) {
            shortcutDragSource = index;
            e.dataTransfer.effectAllowed = 'move';
            e.dataTransfer.setData('text/plain', ''); 
            setTimeout(() => e.target.classList.add('opacity-40', 'bg-brand-base'), 0);
        }
        function handleDragOver(e) { e.preventDefault(); e.dataTransfer.dropEffect = 'move'; e.currentTarget.classList.add('bg-brand-dark/5'); }
        function handleDragLeave(e) { e.currentTarget.classList.remove('bg-brand-dark/5'); }
        function handleDrop(e, targetCIndex, targetIIndex) {
            e.preventDefault();
            if (!dragSource) return;
            const { cIndex: fromC, iIndex: fromI } = dragSource;
            if (fromC === targetCIndex && fromI === targetIIndex) return; 
            const item = appCategories[fromC].items.splice(fromI, 1)[0];
            appCategories[targetCIndex].items.splice(targetIIndex, 0, item);
            saveCategories(); dragSource = null; render(); 
        }
        function handleDropEmpty(e, targetCIndex) {
            e.preventDefault();
            if (!dragSource) return;
            const item = appCategories[dragSource.cIndex].items.splice(dragSource.iIndex, 1)[0];
            appCategories[targetCIndex].items.push(item);
            saveCategories(); dragSource = null; render();
        }
        function handleShortcutDrop(e, targetIndex) {
            e.preventDefault();
            if (shortcutDragSource === null || shortcutDragSource === targetIndex) return;
            const item = appShortcuts.splice(shortcutDragSource, 1)[0];
            appShortcuts.splice(targetIndex, 0, item);
            saveShortcuts(); shortcutDragSource = null; render();
        }
        function handleDragEnd(e) {
            e.target.classList.remove('opacity-40', 'bg-brand-base', 'bg-brand-dark/5');
            dragSource = null; shortcutDragSource = null; render();
        }

        function openReturnedModal(targetDate) {
            if (!targetDate || typeof targetDate !== 'string') targetDate = getTodayString();
            let currentReturned = (allData[targetDate] && allData[targetDate].returned) ? allData[targetDate].returned : {};

            let modalHtml = `
            <div class="fixed inset-0 z-50 flex items-center justify-center p-4" style="animation: fade-in 0.2s ease-out forwards;" onclick="closeReturnedModal(event)">
                <div class="absolute inset-0 bg-brand-dark/40 backdrop-blur-sm"></div>
                
                <div class="relative w-full max-w-sm bg-white rounded-3xl shadow-2xl overflow-hidden flex flex-col max-h-[85vh]" onclick="event.stopPropagation()">
                    <div class="px-5 py-4 border-b border-brand-dark/5 flex justify-between items-center bg-brand-base">
                        <h3 class="font-bold text-brand-dark text-sm flex items-center gap-2">
                            <i class="fa-solid fa-truck-ramp-box text-brand-accent"></i> 廠商洗回登記
                        </h3>
                        <div class="flex items-center gap-3">
                            <div class="relative bg-white border border-brand-dark/10 rounded-md px-2 py-1 flex items-center gap-1.5 text-brand-dark/80 text-[11px] font-bold active:scale-95 transition-transform shadow-sm">
                                <i class="fa-solid fa-calendar-day text-brand-dark/40"></i>
                                ${targetDate.replace(/-/g, '/')}
                                <input type="date" value="${targetDate}" onchange="openReturnedModal(this.value)" class="absolute inset-0 opacity-0 w-full h-full cursor-pointer z-10">
                            </div>
                            <button onclick="closeReturnedModal()" class="w-7 h-7 flex items-center justify-center rounded-full text-brand-dark/50 hover:bg-brand-dark/10 transition-colors"><i class="fa-solid fa-xmark"></i></button>
                        </div>
                    </div>
                    
                    <div class="overflow-y-auto p-5 space-y-4 no-scrollbar">
                        ${appCategories.map(cat => `
                            <div>
                                <h4 class="text-xs font-bold text-brand-dark/50 mb-2">${cat.name}</h4>
                                <div class="space-y-2">
                                    ${cat.items.map(item => `
                                        <div class="flex justify-between items-center bg-brand-base/50 px-3 py-2 rounded-xl border border-brand-dark/5">
                                            <span class="text-[13px] font-semibold text-brand-dark w-20 break-all leading-tight">${item}</span>
                                            <div class="flex items-center gap-2">
                                                <button onclick="adjRet('${item}', -1)" class="w-8 h-8 rounded-full bg-brand-dark/10 text-brand-dark active:scale-95 flex justify-center items-center"><i class="fa-solid fa-minus text-xs"></i></button>
                                                <input type="number" id="ret-input-${item}" value="${currentReturned[item] || 0}" 
                                                    class="ret-input-field w-12 text-center bg-white border border-brand-dark/10 rounded-lg py-1 font-mono font-bold focus:outline-none focus:border-brand-accent text-sm text-brand-dark" 
                                                    onfocus="this.select()" onkeydown="handleRetInputKeydown(event, this)">
                                                <button onclick="adjRet('${item}', 1)" class="w-8 h-8 rounded-full bg-brand-dark/10 text-brand-dark active:scale-95 flex justify-center items-center"><i class="fa-solid fa-plus text-xs"></i></button>
                                            </div>
                                        </div>
                                    `).join('')}
                                </div>
                            </div>
                        `).join('')}
                    </div>
                    <div class="px-5 pb-5 pt-3 border-t border-brand-dark/5">
                        <button onclick="saveReturnedModal('${targetDate}')" class="w-full py-3.5 rounded-xl font-bold text-white bg-brand-accent shadow-md shadow-brand-accent/20 active:scale-95 transition-transform flex justify-center items-center gap-2">
                            <i class="fa-solid fa-check"></i> 儲存洗回數量
                        </button>
                    </div>
                </div>
            </div>
            `;
            document.getElementById('modal-root').innerHTML = modalHtml;
        }

        function handleRetInputKeydown(event, currentInput) {
            if (event.key === 'Enter') {
                event.preventDefault();
                const inputs = Array.from(document.querySelectorAll('.ret-input-field'));
                const index = inputs.indexOf(currentInput);
                if (index > -1 && index < inputs.length - 1) inputs[index + 1].focus();
                else if (index === inputs.length - 1) currentInput.blur();
            }
        }

        function closeReturnedModal(e) {
            if(e && e.target !== e.currentTarget) return;
            document.getElementById('modal-root').innerHTML = '';
        }

        function adjRet(item, delta) {
            let input = document.getElementById(`ret-input-${item}`);
            if(input) {
                let val = parseInt(input.value) || 0;
                input.value = Math.max(0, val + delta);
            }
        }

        function saveReturnedModal(dateStr) {
            let returnedObj = {};
            appCategories.forEach(cat => cat.items.forEach(item => {
                let input = document.getElementById(`ret-input-${item}`);
                if(input) {
                    let val = parseInt(input.value) || 0;
                    if(val > 0) returnedObj[item] = val;
                }
            }));
            
            if (!allData[dateStr]) allData[dateStr] = { rooms: {}, returned: {} };
            allData[dateStr].returned = returnedObj;
            saveAllData();

            closeReturnedModal();
            showMessage('✅ 洗回數量已儲存');
            render();
        }

        async function syncToGoogleSheets() {
            let targetDates = [state.currentDate];
            const nowStr = new Date().toLocaleString('zh-TW');
            
            let itemCols = [];
            appCategories.forEach(cat => cat.items.forEach(item => itemCols.push(item)));

            let records = [];
            let recordHeaders = ['匯出時間', '日期', '房號', '房況狀態', '特殊標籤', ...itemCols, '特殊備註'];
            records.push(recordHeaders);

            let returns = [];
            let returnHeaders = ['匯出時間', '日期', ...itemCols];
            returns.push(returnHeaders);

            targetDates.forEach(date => {
                let dayData = allData[date] || { rooms: {}, returned: {} };
                let roomsData = dayData.rooms || {};
                let returnedData = dayData.returned || {};

                ROOMS.forEach(room => {
                    const data = roomsData[room];
                    if (!data) return;
                    const hasItem = Object.values(data.items || {}).some(v => v > 0);
                    if (hasItem || data.note || data.status !== '空車' || data.specialType !== '一般') {
                        let row = [nowStr, date, room, data.status || '空車', data.specialType || '一般'];
                        itemCols.forEach(item => row.push((data.items && data.items[item]) ? data.items[item] : 0));
                        row.push((data.note || '').replace(/\n/g, ' / '));
                        records.push(row);
                    }
                });

                let hasReturned = Object.values(returnedData).some(v => v > 0);
                if (hasReturned) {
                    let retRow = [nowStr, date];
                    itemCols.forEach(item => retRow.push(returnedData[item] || 0));
                    returns.push(retRow);
                }
            });

            if (records.length === 1 && returns.length === 1) return showMessage("所選區間內尚無任何紀錄可匯出");

            const payload = {
                records: records.length > 1 ? records : null,
                returns: returns.length > 1 ? returns : null
            };

            showMessage("🔄 正在背景同步至 Google 試算表...");

            try {
                await fetch(appGasUrl, {
                    method: 'POST',
                    mode: 'no-cors',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload)
                });
                showMessage("✅ 同步請求已送出！請查看您的試算表");
            } catch (error) {
                console.error("GAS Sync Error:", error);
                showMessage("❌ 同步失敗，請檢查網路連線");
            }
        }

        // 綁定全域函式供 HTML 使用
        window.exitRetro = exitRetro;
        window.selectLoginRole = selectLoginRole;
        window.attemptLogin = attemptLogin;
        window.logout = logout;
        window.setSummaryFilter = setSummaryFilter;
        window.changeSummaryDate = changeSummaryDate;
        window.changeSummaryMonth = changeSummaryMonth;
        window.startRetro = startRetro;
        window.toggleRoomStatus = toggleRoomStatus;
        window.toggleSpecialType = toggleSpecialType;
        window.goToRoom = goToRoom;
        window.goHome = goHome;
        window.goToSummary = goToSummary;
        window.goToSettings = goToSettings;
        window.addNewItem = addNewItem;
        window.removeItem = removeItem;
        window.insertShortcut = insertShortcut;
        window.addShortcut = addShortcut;
        window.removeShortcut = removeShortcut;
        window.updateCount = updateCount;
        window.submitNoteBtn = submitNoteBtn;
        window.openReturnedModal = openReturnedModal;
        window.closeReturnedModal = closeReturnedModal;
        window.handleRetInputKeydown = handleRetInputKeydown;
        window.adjRet = adjRet;
        window.saveReturnedModal = saveReturnedModal;
        window.syncToGoogleSheets = syncToGoogleSheets;
        window.handleDragStart = handleDragStart;
        window.handleDragOver = handleDragOver;
        window.handleDragLeave = handleDragLeave;
        window.handleDrop = handleDrop;
        window.handleDropEmpty = handleDropEmpty;
        window.handleShortcutDragStart = handleShortcutDragStart;
        window.handleShortcutDrop = handleShortcutDrop;
        window.handleDragEnd = handleDragEnd;

        document.addEventListener('keydown', function(event) {
            if(state.view === 'login' && state.loginRole && event.key === 'Enter') attemptLogin();
        });

        // 初始化渲染
        render();
    </script>
</body>
</html>
